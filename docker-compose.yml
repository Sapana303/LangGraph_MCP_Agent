services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file:
      - .env
    environment:
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8002
      OPTICS_RAG_API_URL: ${DOCKER_OPTICS_RAG_API_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      PORT: 8001
      LLM_PROVIDER: groq
      OLLAMA_ENABLED: "false"
      MCP_SERVER_URL: http://mcp:8002/mcp
      CHAT_DATABASE_PATH: /app/data/chat_history.db
      OPTICS_RAG_API_URL: ${DOCKER_OPTICS_RAG_API_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcp
    volumes:
      - chat_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  chat_data:
